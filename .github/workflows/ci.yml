# Two things have to hold before this library can ship: the framebuffer logic is
# right (pytest, on the host) and the sources are something the compiler accepts
# and can build for every architecture the manifest claims (pymcu).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4

      - name: Install the compiler
        run: uv pip install --system --prerelease=allow "pymcu-compiler[avr]"

      # The library checks landed in the driver after 0.1.0a5, so on an older
      # compiler they are skipped out loud rather than failing the run: nothing
      # is wrong with the library, the tooling simply is not published yet.
      # Remove the guard once pymcu-compiler ships them.
      - name: Lint the library
        run: |
          if pymcu lint --help 2>&1 | grep -q -- "--library"; then
            pymcu lint --library src/pymcu_lib_neopixel
          else
            echo "skipped: needs a pymcu-compiler with 'lint --library'" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Compiles the example for one chip per architecture and fails when the
      # result contradicts supports.arch in either direction.
      - name: Measure it
        run: |
          if pymcu --help 2>&1 | grep -q "index"; then
            echo "." > libraries.txt
            pymcu index build --from libraries.txt --venv .check-venv \
              --output measured.json --strict
          else
            echo "skipped: needs a pymcu-compiler with 'index build'" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Whatever the compiler's vintage, the example must still build.
      - name: Build the example
        run: |
          cd src/pymcu_lib_neopixel/examples/basic
          uv pip install --system --prerelease=allow -e "$GITHUB_WORKSPACE"
          pymcu build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured
          path: measured.json
          if-no-files-found: ignore
