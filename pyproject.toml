[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymcu-lib-neopixel"
version = "0.1.0"
description = "WS2812 / NeoPixel addressable LED strips for PyMCU"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Iván Montiel Cardona", email = "contact@pymcu.org" }
]
keywords = ["pymcu", "neopixel", "ws2812", "microcontroller"]
dependencies = ["pymcu-stdlib>=0.1.0a5"]

[project.urls]
Homepage = "https://pymcu.org"
Repository = "https://github.com/PyMCU/pymcu-lib-neopixel"

[project.entry-points."pymcu.libraries"]
neopixel = "pymcu_lib_neopixel"

[tool.hatch.build.targets.wheel]
packages = ["src/pymcu_lib_neopixel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
