[library]
name = "neopixel"
summary = "WS2812 / NeoPixel addressable LED strips"
license = "MIT"
repository = "https://github.com/PyMCU/pymcu-lib-neopixel"
categories = ["display", "led"]
sources = "mcu"

[library.provides]
modules = ["neopixel", "_neopixel"]

[library.supports]
# The RP2040 and RP2350 arms of mcu/_neopixel/core.py are in the tree and tested on the host, but
# they call pymcu.hal.ws2812, whose PIO implementation is not in a published pymcu-stdlib yet
# (0.1.0b1 stops at "WS2812 pixels are not implemented on this architecture yet"). "arm" goes back
# here, together with the stdlib floor below moving to the release that ships the HAL.
arch = ["avr"]
chips = []
layer = "native"
adapters = ["micropython", "circuitpython"]

[library.requires]
stdlib = ">=0.1.0a5"
language-level = 1

[library.examples]
basic = "examples/basic"
micropython_basic = "examples/micropython_basic"
circuitpython_basic = "examples/circuitpython_basic"
color_wipe = "examples/color_wipe"
auto_write = "examples/auto_write"
