[library]
name = "neopixel"
summary = "WS2812 / NeoPixel addressable LED strips"
license = "MIT"
repository = "https://github.com/PyMCU/pymcu-lib-neopixel"
categories = ["display", "led"]

[library.provides]
modules = ["neopixel"]

[library.supports]
arch = ["avr"]
chips = []
layer = "native"
adapters = ["micropython", "circuitpython"]

[library.requires]
stdlib = ">=0.1.0a5"
language-level = 1

[library.examples]
basic = "examples/basic"
